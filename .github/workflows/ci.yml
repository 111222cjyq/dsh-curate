name: ci

# Test-only workflow: no publish, no secrets, no registry writes.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client bundle
        run: npm run build

      # lib/*.js and src/vendor.bundle.js are committed so a GitHub source
      # install needs no build. Fail the job if a rebuild produces different
      # bytes, i.e. the committed artifacts are stale relative to src/.
      - name: Committed build artifacts are current
        run: git diff --exit-code -- lib src/vendor.bundle.js

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      # Catches a broken `files` list or a missing runtime file before a
      # release, without writing a tarball into the workspace.
      - name: Inspect npm package contents
        run: npm pack --dry-run --json
